name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The shards are ~24 GB; the validator checks their Git LFS pointers.
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_release.py
      - run: python -m unittest discover -s tests
